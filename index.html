<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yard signs — Eastern Shore</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#F1E7CC;
    --parchment-deep:#E7D9B4;
    --ink:#26211A;
    --ink-soft:#5B5344;
    --navy:#1C3B4D;
    --navy-light:#2E5570;
    --brass:#B07C33;
    --brass-light:#D9A85C;
    --rust:#A8452F;
    --marsh:#52694F;
    --hairline: rgba(38,33,26,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--navy);font-family:'Inter',sans-serif;color:var(--ink);}

  #app{display:flex;flex-direction:column;height:100vh;}

  header{
    background:var(--navy);
    color:var(--parchment);
    padding:14px 22px;
    display:flex;
    align-items:center;
    gap:14px;
    border-bottom:2px solid var(--brass);
    flex-shrink:0;
  }
  .compass{width:34px;height:34px;flex-shrink:0;animation:settle 900ms cubic-bezier(.2,.8,.2,1) 1;}
  @keyframes settle{from{transform:rotate(-95deg);opacity:0;}to{transform:rotate(0deg);opacity:1;}}
  header h1{
    font-family:'Spectral',serif;
    font-weight:600;
    font-size:20px;
    letter-spacing:0.02em;
    margin:0;
  }
  header p{
    margin:2px 0 0;
    font-size:12.5px;
    color:var(--brass-light);
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.03em;
  }
  header .hint{
    margin-left:auto;
    font-size:12.5px;
    color:var(--parchment-deep);
    text-align:right;
    max-width:220px;
    line-height:1.4;
    display:none;
  }
  @media(min-width:720px){ header .hint{display:block;} }
  #copy-link-btn{
    display:none;align-items:center;gap:6px;flex-shrink:0;
    background:var(--brass);color:var(--ink);border:none;border-radius:6px;
    padding:8px 12px;font-size:12.5px;font-weight:600;font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  #copy-link-btn:hover{background:var(--brass-light);}
  #import-btn{
    display:none;flex-shrink:0;
    background:var(--marsh);color:var(--parchment);border:none;border-radius:6px;
    padding:8px 12px;font-size:12.5px;font-weight:600;font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  #import-btn:hover{opacity:0.9;}

  #body{display:flex;flex:1;min-height:0;}
  #map{flex:1;min-width:0;position:relative;}

  #search-wrap{
    position:absolute;top:14px;left:14px;z-index:1000;
    width:280px;max-width:calc(100% - 90px);
  }
  #search-box{
    display:flex;align-items:center;gap:8px;
    background:var(--parchment);border:1.5px solid var(--brass);border-radius:8px;
    padding:8px 10px;box-shadow:0 2px 6px rgba(0,0,0,0.25);
  }
  #search-box svg{flex-shrink:0;color:var(--navy);}
  #search-input{
    flex:1;border:none;background:none;outline:none;
    font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);
  }
  #search-input::placeholder{color:var(--ink-soft);}
  #search-clear{
    border:none;background:none;color:var(--ink-soft);cursor:pointer;
    font-size:16px;line-height:1;padding:0 2px;display:none;
  }
  #search-results{
    margin-top:6px;background:var(--parchment);border:1px solid var(--hairline);
    border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,0.2);overflow:hidden;display:none;
    max-height:260px;overflow-y:auto;
  }
  .search-result{
    padding:9px 11px;font-size:12.5px;color:var(--ink);cursor:pointer;
    border-bottom:1px solid var(--hairline);line-height:1.4;
  }
  .search-result:last-child{border-bottom:none;}
  .search-result:hover{background:var(--parchment-deep);}
  .search-result .r-name{font-weight:600;font-size:13px;}
  .search-result .r-detail{color:var(--ink-soft);font-size:11.5px;margin-top:1px;}
  #search-status{
    padding:9px 11px;font-size:12px;color:var(--ink-soft);display:none;
  }

  #area-tool{
    position:absolute;bottom:18px;left:14px;z-index:1000;
  }
  #select-area-btn{
    display:flex;align-items:center;gap:7px;
    background:var(--parchment);color:var(--ink);border:1.5px solid var(--brass);border-radius:8px;
    padding:9px 13px;font-size:12.5px;font-weight:600;font-family:'Inter',sans-serif;
    cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.25);
  }
  #select-area-btn:hover{background:var(--parchment-deep);}
  #select-area-btn.active{background:var(--rust);color:var(--parchment);border-color:var(--rust);}
  #select-area-btn svg{flex-shrink:0;}
  #area-hint{
    margin-top:8px;background:var(--ink);color:var(--parchment);font-size:12px;
    padding:7px 11px;border-radius:6px;max-width:220px;line-height:1.4;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);display:none;
  }
  #area-hint.show{display:block;}

  .area-popup{font-family:'Inter',sans-serif;min-width:170px;}
  .area-popup .area-count{
    font-family:'Spectral',serif;font-weight:600;font-size:15px;color:var(--navy);
  }
  .area-popup ul{margin:6px 0 0;padding-left:16px;font-size:12px;color:var(--ink-soft);max-height:130px;overflow-y:auto;}
  .area-popup .area-more{margin-top:4px;font-size:11.5px;color:var(--ink-soft);}
  .area-popup button{
    margin-top:9px;width:100%;background:var(--navy);color:var(--parchment);
    border:none;border-radius:4px;padding:7px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .area-popup button:hover{background:var(--navy-light);}
  .area-count-label{
    font-family:'Spectral',serif;font-weight:600;font-size:12.5px;color:var(--parchment);
    background:var(--rust);padding:2px 7px;border-radius:3px;white-space:nowrap;
  }

  #log{
    width:300px;
    flex-shrink:0;
    background:var(--parchment);
    border-left:2px solid var(--brass);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  #log-head{
    padding:14px 16px 10px;
    border-bottom:1px solid var(--hairline);
    flex-shrink:0;
  }
  #log-head h2{
    font-family:'Spectral',serif;
    font-size:15px;
    font-weight:600;
    margin:0 0 2px;
    color:var(--navy);
  }
  #log-head span{
    font-size:11.5px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
  }
  #log-list{
    flex:1;
    overflow-y:auto;
    padding:6px 10px 16px;
  }
  .entry{
    background:#FBF6E8;
    border:1px solid var(--hairline);
    border-radius:6px;
    padding:10px 11px;
    margin:8px 0;
    cursor:pointer;
    transition:border-color 120ms ease;
  }
  .entry:hover{border-color:var(--brass);}
  .entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
  .entry-name{
    font-weight:600;
    font-size:13.5px;
    color:var(--ink);
    line-height:1.3;
  }
  .entry-del{
    background:none;border:none;color:var(--ink-soft);
    font-size:15px;line-height:1;cursor:pointer;padding:2px 4px;
    border-radius:4px;flex-shrink:0;
  }
  .entry-del:hover{color:var(--rust);background:rgba(168,69,47,0.1);}
  .entry-note{
    font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .entry-coord{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--marsh);
    margin-top:6px;
  }
  #log-empty{
    padding:24px 12px;text-align:center;color:var(--ink-soft);font-size:13px;line-height:1.6;
  }

  .pin-form{font-family:'Inter',sans-serif;min-width:200px;}
  .pin-form label{display:block;font-size:11px;color:var(--ink-soft);margin:8px 0 3px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
  .pin-form input,.pin-form textarea{
    width:100%;border:1px solid var(--hairline);border-radius:4px;
    padding:6px 8px;font-family:'Inter',sans-serif;font-size:13px;resize:vertical;
  }
  .pin-form textarea{min-height:50px;}
  .pin-form button{
    margin-top:10px;width:100%;background:var(--navy);color:var(--parchment);
    border:none;border-radius:4px;padding:8px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .pin-form button:hover{background:var(--navy-light);}

  .leaflet-control-layers{
    border-radius:8px !important;border:1.5px solid var(--brass) !important;
    font-family:'Inter',sans-serif;font-size:13px;
  }
  .leaflet-popup-content-wrapper{border-radius:8px;}
  .chart-pin-label{
    font-family:'Spectral',serif;font-weight:600;font-size:12px;color:var(--navy);
    background:var(--parchment);padding:1px 6px;border-radius:3px;border:1px solid var(--brass);
    white-space:nowrap;
  }
  .chart-pin-svg{
    transition:transform 120ms ease;
    transform-origin:bottom center;
  }
  .leaflet-marker-icon:hover .chart-pin-svg{
    transform:scale(1.15);
  }

  #toast{
    position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--parchment);font-size:12.5px;
    padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;
    transition:opacity 200ms ease;z-index:1000;
  }
  #toast.show{opacity:1;}

  #debug-line{
    position:absolute;bottom:4px;right:8px;z-index:1000;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:rgba(241,231,204,0.55);
    background:rgba(0,0,0,0.35);padding:2px 8px;border-radius:4px;pointer-events:none;
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--parchment-deep);border-radius:4px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <svg class="compass" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#D9A85C" stroke-width="1.5"/>
      <polygon points="20,4 23,20 20,36 17,20" fill="#D9A85C"/>
      <polygon points="20,10 22,20 20,30 18,20" fill="#A8452F"/>
      <circle cx="20" cy="20" r="2.2" fill="#F1E7CC"/>
    </svg>
    <div>
      <h1>Yard signs</h1>
      <p>Maryland &middot; Eastern Shore</p>
    </div>
    <div class="hint">Shared chart &mdash; drag any sign to fine-tune its exact spot.</div>
    <button id="copy-link-btn" style="display:none;" aria-label="Copy shareable link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
      Copy link
    </button>
    <button id="import-btn" style="display:none;" aria-label="Import saved sign list">Import saved list</button>
  </header>
  <div id="body">
    <div id="map">
      <div id="search-wrap">
        <div id="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="search-input" type="text" placeholder="Search a full address, e.g. 102 Metcalf Rd, Chestertown">
          <button id="search-clear" aria-label="Clear search">&times;</button>
        </div>
        <div id="search-results"></div>
      </div>
      <div id="area-tool">
        <button id="select-area-btn" aria-label="Highlight an area to count signs">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="1"/><circle cx="4" cy="4" r="1.6" fill="currentColor" stroke="none"/><circle cx="20" cy="4" r="1.6" fill="currentColor" stroke="none"/><circle cx="4" cy="20" r="1.6" fill="currentColor" stroke="none"/><circle cx="20" cy="20" r="1.6" fill="currentColor" stroke="none"/></svg>
          <span id="select-area-label">Highlight area</span>
        </button>
        <div id="area-hint">Drag a box over the map to count signs inside it.</div>
      </div>
    </div>
    <div id="log">
      <div id="log-head">
        <h2>Sign log</h2>
        <span id="log-count">0 signs</span>
      </div>
      <div id="log-list"><div id="log-empty">No signs yet. Click the chart to add your first yard sign.</div></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="debug-line">not loaded yet</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const EASTERN_SHORE_CENTER = [38.62, -75.85];
const DEFAULT_ZOOM = 9;
const PIN_SCALE = 0.65;

let pins = [];
let markers = {};

const map = L.map('map', { zoomControl: true }).setView(EASTERN_SHORE_CENTER, DEFAULT_ZOOM);

const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
});
const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Imagery &copy; Esri'
});
streetLayer.addTo(map);
L.control.layers({ 'Streets': streetLayer, 'Satellite': satelliteLayer }, null, { position: 'topright' }).addTo(map);

function pinIcon(){
  const w = Math.round(30 * PIN_SCALE);
  const h = Math.round(34 * PIN_SCALE);
  return L.divIcon({
    className: '',
    html: '<svg class="chart-pin-svg" width="' + w + '" height="' + h + '" viewBox="0 0 30 34" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 1.5px 2px rgba(0,0,0,0.4));">' +
      '<ellipse cx="15" cy="33" rx="8.5" ry="1.4" fill="rgba(0,0,0,0.28)"/>' +
      '<line x1="9" y1="32" x2="9" y2="15.5" stroke="#16303F" stroke-width="2" stroke-linecap="round"/>' +
      '<line x1="21" y1="32" x2="21" y2="15.5" stroke="#16303F" stroke-width="2" stroke-linecap="round"/>' +
      '<rect x="1" y="0.5" width="28" height="17" rx="2.5" fill="#F8F1DC" stroke="#A8452F" stroke-width="2"/>' +
      '<path d="M2.3 1.8 Q15 -0.5 27.7 1.8 L27.7 6.5 Q15 4.5 2.3 6.5 Z" fill="rgba(255,255,255,0.4)"/>' +
      '<line x1="6" y1="6.5" x2="24" y2="6.5" stroke="#A8452F" stroke-width="1.6" stroke-linecap="round"/>' +
      '<line x1="6" y1="10.5" x2="19" y2="10.5" stroke="#A8452F" stroke-width="1.6" stroke-linecap="round"/>' +
      '<line x1="6" y1="14.5" x2="22" y2="14.5" stroke="#A8452F" stroke-width="1.6" stroke-linecap="round"/>' +
      '</svg>',
    iconSize: [w, h],
    iconAnchor: [Math.round(w / 2), h],
    popupAnchor: [0, -Math.round(22 * PIN_SCALE)]
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function fmtCoord(lat, lng){
  const ns = lat >= 0 ? 'N' : 'S';
  const ew = lng >= 0 ? 'E' : 'W';
  return Math.abs(lat).toFixed(4) + '\u00b0' + ns + ', ' + Math.abs(lng).toFixed(4) + '\u00b0' + ew;
}

const STORAGE_KEY = 'pins';
const FIXED_BUCKET_ID = 'HpeR9ZEusGjUYpZuEW9mT8';
let lastRaw = null;
const hasClaudeStorage = (typeof window.storage === 'object' && window.storage !== null);
if (!hasClaudeStorage){
  document.querySelector('header .hint').textContent = FIXED_BUCKET_ID
    ? 'Send anyone this exact page URL \u2014 it always opens the same shared list.'
    : 'This copy has no shared list locked in yet. See the setup banner below.';
}
let bucketId = FIXED_BUCKET_ID || null;

function showSetupBanner(id){
  const banner = document.createElement('div');
  banner.id = 'setup-banner';
  banner.style.cssText = 'background:#2E5570;color:#F1E7CC;padding:12px 16px;font-size:13px;line-height:1.6;font-family:Inter,sans-serif;';
  banner.innerHTML =
    '<strong>One-time setup needed.</strong> This copy of the file has no shared list locked in, so it just created a new one. ' +
    'Send this ID to whoever manages the file so they can lock it in as <code style="background:rgba(0,0,0,0.25);padding:1px 5px;border-radius:3px;">FIXED_BUCKET_ID</code>: ' +
    '<code id="setup-id" style="background:rgba(0,0,0,0.25);padding:1px 5px;border-radius:3px;">' + id + '</code> ' +
    '<button id="setup-copy" style="margin-left:8px;background:#B07C33;color:#26211A;border:none;border-radius:4px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;">Copy ID</button> ' +
    'Once that\'s done and the file is redeployed, this banner goes away and the plain page URL always shares the same list for everyone.';
  document.getElementById('app').prepend(banner);
  document.getElementById('setup-copy').addEventListener('click', () => {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(id).then(() => showToast('ID copied'));
    }
  });
}

async function ensureBucket(){
  if (bucketId) return bucketId;
  try {
    const res = await fetch('https://kvdb.io/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'email=' + encodeURIComponent('yardsigns.map@example.com')
    });
    if (res.ok){
      const id = (await res.text()).trim();
      if (id){
        bucketId = id;
        showSetupBanner(bucketId);
      }
    }
  } catch (e) {
    // creation failed, will fall back to browser-local storage below
  }
  return bucketId;
}

function setDebugLine(msg){
  const el = document.getElementById('debug-line');
  if (el) el.textContent = msg;
}

async function loadPins(){
  try {
    if (hasClaudeStorage){
      const result = await window.storage.get(STORAGE_KEY, true);
      lastRaw = result && result.value ? result.value : '[]';
      setDebugLine('load: claude storage OK');
    } else {
      await ensureBucket();
      if (bucketId){
        const res = await fetch('https://kvdb.io/' + bucketId + '/signs');
        lastRaw = res.ok ? (await res.text()) : '[]';
        if (!lastRaw) lastRaw = '[]';
        setDebugLine('load: kvdb ' + res.status + ' \u00b7 bucket ' + bucketId.slice(0, 8) + '\u2026');
      } else {
        lastRaw = localStorage.getItem('yard_signs_local') || '[]';
        setDebugLine('load: local only, no bucket');
      }
    }
    pins = JSON.parse(lastRaw);
  } catch (e) {
    pins = [];
    lastRaw = '[]';
    setDebugLine('load: error \u2014 ' + e.message);
  }
  pins.forEach(addMarkerForPin);
  renderLog();
}

async function savePins(){
  const raw = JSON.stringify(pins);
  try {
    if (hasClaudeStorage){
      await window.storage.set(STORAGE_KEY, raw, true);
      setDebugLine('save: claude storage OK \u00b7 ' + pins.length + ' signs');
    } else if (bucketId){
      const res = await fetch('https://kvdb.io/' + bucketId + '/signs', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: raw
      });
      if (!res.ok){
        showToast('Save failed (server said ' + res.status + ') \u2014 not saved');
        setDebugLine('save: kvdb FAILED ' + res.status + ' \u00b7 bucket ' + bucketId.slice(0, 8) + '\u2026');
        return;
      }
      setDebugLine('save: kvdb 200 OK \u00b7 ' + pins.length + ' signs \u00b7 bucket ' + bucketId.slice(0, 8) + '\u2026');
    } else {
      localStorage.setItem('yard_signs_local', raw);
      setDebugLine('save: local only, no bucket');
    }
    lastRaw = raw;
  } catch (e) {
    showToast('Could not save signs right now \u2014 check your connection');
    setDebugLine('save: network error \u2014 ' + e.message);
  }
}

function newPinId(){
  return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
}

async function syncFromRemote(){
  try {
    let raw;
    if (hasClaudeStorage){
      const result = await window.storage.get(STORAGE_KEY, true);
      raw = result && result.value ? result.value : '[]';
    } else if (bucketId){
      const res = await fetch('https://kvdb.io/' + bucketId + '/signs');
      raw = res.ok ? (await res.text()) : lastRaw;
      if (!raw) raw = '[]';
    } else {
      return;
    }
    if (raw === lastRaw) return;
    lastRaw = raw;
    const remotePins = JSON.parse(raw);
    Object.keys(markers).forEach(id => { map.removeLayer(markers[id]); delete markers[id]; });
    pins = remotePins;
    pins.forEach(addMarkerForPin);
    renderLog();
  } catch (e) {
    // skip a bad sync cycle, try again next interval
  }
}

setInterval(syncFromRemote, 20000);


function addMarkerForPin(pin){
  const marker = L.marker([pin.lat, pin.lng], { icon: pinIcon(), draggable: true }).addTo(map);
  marker.bindTooltip(pin.name, { direction: 'top', offset: [0, -Math.round(30 * PIN_SCALE)], className: 'chart-pin-label' });
  marker.on('click', () => openViewPopup(pin));
  marker.on('dragend', async () => {
    const pos = marker.getLatLng();
    pin.lat = pos.lat;
    pin.lng = pos.lng;
    renderLog();
    await savePins();
    showToast('Sign position updated');
  });
  markers[pin.id] = marker;
}

async function removePin(pin){
  pins = pins.filter(p => p.id !== pin.id);
  if (markers[pin.id]){ map.removeLayer(markers[pin.id]); delete markers[pin.id]; }
  renderLog();
  map.closePopup();
  await savePins();
  showToast('Sign removed');
}

function openViewPopup(pin){
  const div = document.createElement('div');
  div.style.minWidth = '180px';
  div.innerHTML = '<div style="font-family:Spectral,serif;font-weight:600;font-size:14px;color:#1C3B4D;">' +
    escapeHtml(pin.name) + '</div>' +
    (pin.note ? '<div style="font-size:12.5px;color:#5B5344;margin-top:4px;line-height:1.4;">' + escapeHtml(pin.note) + '</div>' : '') +
    '<div style="font-family:IBM Plex Mono,monospace;font-size:10.5px;color:#52694F;margin-top:6px;">' + fmtCoord(pin.lat, pin.lng) + '</div>' +
    '<button type="button" style="margin-top:9px;width:100%;background:#A8452F;color:#F1E7CC;border:none;border-radius:4px;padding:7px;font-size:12.5px;font-weight:600;cursor:pointer;">Delete sign</button>';
  const delBtn = div.querySelector('button');
  delBtn.addEventListener('click', () => removePin(pin));
  L.popup().setLatLng([pin.lat, pin.lng]).setContent(div).openOn(map);
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

let selectMode = false;
let selectRect = null;
let selectStart = null;
let areaPopup = null;
let suppressMapClick = false;

const selectAreaBtn = document.getElementById('select-area-btn');
const selectAreaLabel = document.getElementById('select-area-label');
const areaHint = document.getElementById('area-hint');

function setSelectMode(on){
  selectMode = on;
  selectAreaBtn.classList.toggle('active', on);
  selectAreaLabel.textContent = on ? 'Cancel' : 'Highlight area';
  areaHint.classList.toggle('show', on);
  document.getElementById('map').style.cursor = on ? 'crosshair' : '';
  if (on){
    map.dragging.disable();
    clearHighlight();
  } else {
    map.dragging.enable();
  }
}

selectAreaBtn.addEventListener('click', () => setSelectMode(!selectMode));

function clearHighlight(){
  if (selectRect){ map.removeLayer(selectRect); selectRect = null; }
  if (areaPopup){ map.closePopup(areaPopup); areaPopup = null; }
}

function onSelectMouseMove(e){
  if (!selectStart || !selectRect) return;
  selectRect.setBounds(L.latLngBounds(selectStart, e.latlng));
}

function onSelectMouseUp(e){
  map.off('mousemove', onSelectMouseMove);
  if (!selectStart || !selectRect){ selectStart = null; return; }
  const bounds = L.latLngBounds(selectStart, e.latlng);
  selectRect.setBounds(bounds);
  const matched = pins.filter(p => bounds.contains(L.latLng(p.lat, p.lng)));
  showAreaResult(bounds, matched);
  selectStart = null;
  suppressMapClick = true;
  setSelectMode(false);
}

map.on('mousedown', (e) => {
  if (!selectMode) return;
  L.DomEvent.stop(e);
  clearHighlight();
  selectStart = e.latlng;
  selectRect = L.rectangle(L.latLngBounds(selectStart, selectStart), {
    color: '#A8452F', weight: 2, fillColor: '#A8452F', fillOpacity: 0.15, dashArray: '5,4'
  }).addTo(map);
  map.on('mousemove', onSelectMouseMove);
  map.once('mouseup', onSelectMouseUp);
});

function showAreaResult(bounds, matched){
  selectRect.bindTooltip(
    matched.length + (matched.length === 1 ? ' sign' : ' signs'),
    { permanent: true, direction: 'center', className: 'area-count-label' }
  ).openTooltip();

  const content = document.createElement('div');
  content.className = 'area-popup';
  const shown = matched.slice(0, 8);
  const listHtml = shown.length
    ? '<ul>' + shown.map(p => '<li>' + escapeHtml(p.name) + '</li>').join('') + '</ul>'
    : '';
  const moreHtml = matched.length > shown.length
    ? '<div class="area-more">+' + (matched.length - shown.length) + ' more</div>'
    : '';
  content.innerHTML =
    '<div class="area-count">' + matched.length + (matched.length === 1 ? ' sign' : ' signs') + ' in this area</div>' +
    listHtml + moreHtml +
    '<button type="button">Clear highlight</button>';
  content.querySelector('button').addEventListener('click', clearHighlight);

  areaPopup = L.popup({ closeOnClick: false, autoClose: false })
    .setLatLng(bounds.getCenter())
    .setContent(content)
    .openOn(map);
}

map.on('click', (e) => {
  if (selectMode || suppressMapClick){ suppressMapClick = false; return; }
  const { lat, lng } = e.latlng;
  const container = document.createElement('div');
  container.className = 'pin-form';
  container.innerHTML =
    '<label>Customer / address</label><input type="text" placeholder="e.g. Smith residence" maxlength="60">' +
    '<label>Note</label><textarea placeholder="e.g. installed 8/12, follow up needed"></textarea>' +
    '<button type="button">Add sign</button>';
  const nameInput = container.querySelector('input');
  const noteInput = container.querySelector('textarea');
  const btn = container.querySelector('button');
  const popup = L.popup({ closeOnClick: false })
    .setLatLng(e.latlng)
    .setContent(container)
    .openOn(map);
  setTimeout(() => nameInput.focus(), 50);
  btn.addEventListener('click', async () => {
    const name = nameInput.value.trim() || 'Untitled sign';
    const note = noteInput.value.trim();
    btn.disabled = true;
    const pin = { id: newPinId(), name, note, lat, lng, ts: Date.now() };
    pins.unshift(pin);
    addMarkerForPin(pin);
    renderLog();
    await savePins();
    map.closePopup(popup);
    showToast('Sign added');
  });
});

function renderLog(){
  const list = document.getElementById('log-list');
  const count = document.getElementById('log-count');
  count.textContent = pins.length + (pins.length === 1 ? ' sign' : ' signs');
  if (pins.length === 0){
    list.innerHTML = '<div id="log-empty">No signs yet. Click the chart to add your first yard sign.</div>';
    return;
  }
  list.innerHTML = '';
  pins.forEach(pin => {
    const el = document.createElement('div');
    el.className = 'entry';
    el.innerHTML =
      '<div class="entry-top"><div class="entry-name">' + escapeHtml(pin.name) + '</div>' +
      '<button class="entry-del" aria-label="Remove sign" title="Remove">&times;</button></div>' +
      (pin.note ? '<div class="entry-note">' + escapeHtml(pin.note) + '</div>' : '') +
      '<div class="entry-coord">' + fmtCoord(pin.lat, pin.lng) + '</div>';
    el.addEventListener('click', (ev) => {
      if (ev.target.classList.contains('entry-del')) return;
      map.flyTo([pin.lat, pin.lng], 13, { duration: 0.8 });
      setTimeout(() => openViewPopup(pin), 700);
    });
    el.querySelector('.entry-del').addEventListener('click', async (ev) => {
      ev.stopPropagation();
      await removePin(pin);
    });
    list.appendChild(el);
  });
}

const searchWrap = document.getElementById('search-wrap');
L.DomEvent.disableClickPropagation(searchWrap);
L.DomEvent.disableScrollPropagation(searchWrap);

const areaTool = document.getElementById('area-tool');
L.DomEvent.disableClickPropagation(areaTool);

const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
const searchClear = document.getElementById('search-clear');
let searchTimer = null;
let searchMarker = null;

const SHORE_VIEWBOX = '-76.85,39.75,-75.00,37.85';

function closeResults(){
  searchResults.style.display = 'none';
  searchResults.innerHTML = '';
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  searchClear.style.display = q ? 'block' : 'none';
  clearTimeout(searchTimer);
  if (!q){ closeResults(); return; }
  searchTimer = setTimeout(() => runSearch(q), 400);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.style.display = 'none';
  closeResults();
  searchInput.focus();
});

function jsonp(url){
  return new Promise((resolve, reject) => {
    const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
    const script = document.createElement('script');
    const cleanup = () => { delete window[cbName]; script.remove(); };
    window[cbName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('jsonp failed')); };
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
    document.body.appendChild(script);
    setTimeout(() => { if (window[cbName]) { cleanup(); reject(new Error('jsonp timeout')); } }, 6000);
  });
}

async function searchCensus(q){
  try {
    const url = 'https://geocoding.geo.census.gov/geocoder/locations/onelineaddress?address=' +
      encodeURIComponent(q) + '&benchmark=Public_AR_Current&format=jsonp';
    const data = await jsonp(url);
    const matches = (data && data.result && data.result.addressMatches) || [];
    return matches.map(m => ({
      primary: m.matchedAddress,
      secondary: 'Matched address',
      lat: m.coordinates.y,
      lng: m.coordinates.x
    }));
  } catch (e) {
    return [];
  }
}

async function searchNominatim(q){
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=6&viewbox=' +
      SHORE_VIEWBOX + '&q=' + encodeURIComponent(q);
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    const data = await res.json();
    return (data || []).map(r => {
      const parts = r.display_name.split(',');
      return {
        primary: parts[0].trim(),
        secondary: parts.slice(1, 4).join(',').trim(),
        lat: parseFloat(r.lat),
        lng: parseFloat(r.lon)
      };
    });
  } catch (e) {
    return [];
  }
}

function dedupe(list){
  const out = [];
  list.forEach(item => {
    const clash = out.find(o => Math.abs(o.lat - item.lat) < 0.0008 && Math.abs(o.lng - item.lng) < 0.0008);
    if (!clash) out.push(item);
  });
  return out;
}

function stripHouseNumber(q){
  return q.replace(/^\s*\d+[a-zA-Z]?\s+/, '').trim();
}

function cityZipPortion(q){
  const parts = q.split(',').map(s => s.trim()).filter(Boolean);
  if (parts.length >= 2) return parts.slice(1).join(', ');
  return q;
}

async function runSearch(q){
  searchResults.style.display = 'block';
  searchResults.innerHTML = '<div id="search-status" style="display:block;">Searching&hellip;</div>';
  const [censusResults, nomResults] = await Promise.all([searchCensus(q), searchNominatim(q)]);
  let combined = dedupe([...censusResults, ...nomResults]).slice(0, 7);

  if (combined.length === 0){
    const streetQ = stripHouseNumber(q);
    if (streetQ && streetQ !== q){
      const streetResults = await searchNominatim(streetQ);
      if (streetResults.length){
        combined = streetResults.slice(0, 5).map(r => ({
          ...r,
          secondary: r.secondary + ' \u2014 street level, house number not mapped yet'
        }));
      }
    }
  }

  if (combined.length === 0){
    const cityQ = cityZipPortion(q);
    if (cityQ && cityQ !== q){
      const cityResults = await searchNominatim(cityQ);
      if (cityResults.length){
        combined = cityResults.slice(0, 3).map(r => ({
          ...r,
          secondary: r.secondary + ' \u2014 nearest area match, place the pin by eye'
        }));
      }
    }
  }

  renderResults(combined, combined.length === 0);
}

function renderResults(results, showFallbackHint){
  if (!results || results.length === 0){
    searchResults.innerHTML = '<div id="search-status" style="display:block;">' +
      'No match, even nearby. This address may be too new for the map data. ' +
      'Zoom in and click the spot directly to drop a pin instead.</div>';
    return;
  }
  searchResults.innerHTML = '';
  results.forEach(r => {
    const el = document.createElement('div');
    el.className = 'search-result';
    el.innerHTML = '<div class="r-name">' + escapeHtml(r.primary) + '</div><div class="r-detail">' + escapeHtml(r.secondary) + '</div>';
    el.addEventListener('click', () => selectResult(r));
    searchResults.appendChild(el);
  });
}

function selectResult(r){
  const lat = r.lat;
  const lng = r.lng;
  closeResults();
  searchInput.value = r.primary;
  searchClear.style.display = 'block';
  if (searchMarker) map.removeLayer(searchMarker);
  searchMarker = L.marker([lat, lng], { icon: pinIcon(), opacity: 0.9 }).addTo(map);
  map.flyTo([lat, lng], 19, { duration: 0.9 });
  setTimeout(() => {
    map.fire('click', { latlng: L.latLng(lat, lng) });
    if (searchMarker){ map.removeLayer(searchMarker); searchMarker = null; }
  }, 750);
}

document.addEventListener('click', (e) => {
  if (!document.getElementById('search-wrap').contains(e.target)) closeResults();
});

document.getElementById('copy-link-btn').addEventListener('click', () => {
  const url = window.location.href;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(
      () => showToast('Link copied \u2014 send it to colleagues'),
      () => showToast('Copy the address bar URL to share')
    );
  } else {
    showToast('Copy the address bar URL to share');
  }
});
document.getElementById('copy-link-btn').style.display = 'inline-flex';

async function runBulkImport(){
  const btn = document.getElementById('import-btn');
  btn.disabled = true;
  btn.textContent = 'Importing\u2026';
  let added = 0;
  BULK_IMPORT_COORDS.forEach(c => {
    const exists = pins.some(p => Math.abs(p.lat - c.lat) < 0.0003 && Math.abs(p.lng - c.lng) < 0.0003);
    if (!exists){
      const pin = { id: newPinId(), name: 'Yard sign', note: '', lat: c.lat, lng: c.lng, ts: Date.now() };
      pins.push(pin);
      addMarkerForPin(pin);
      added++;
    }
  });
  if (added > 0){
    renderLog();
    await savePins();
    showToast(added + ' signs imported');
  } else {
    setDebugLine('import: already up to date \u00b7 ' + pins.length + ' signs');
  }
  btn.disabled = false;
  btn.textContent = 'Import saved list';
}

document.getElementById('import-btn').addEventListener('click', runBulkImport);
if (!hasClaudeStorage){
  document.getElementById('import-btn').style.display = 'inline-block';
}

async function importAlreadyDone(){
  try {
    if (hasClaudeStorage){
      const r = await window.storage.get('import_done', true);
      return !!(r && r.value === 'true');
    } else if (bucketId){
      const res = await fetch('https://kvdb.io/' + bucketId + '/import_done');
      return res.ok;
    }
  } catch (e) {
    // treat as not-done, safe default
  }
  return false;
}

async function markImportDone(){
  try {
    if (hasClaudeStorage){
      await window.storage.set('import_done', 'true', true);
    } else if (bucketId){
      await fetch('https://kvdb.io/' + bucketId + '/import_done', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: 'true'
      });
    }
  } catch (e) {
    // if this fails, worst case the auto-import runs once more next load, which is still safe
  }
}

loadPins().then(async () => {
  const done = await importAlreadyDone();
  if (!done){
    await runBulkImport();
    await markImportDone();
  }
});
